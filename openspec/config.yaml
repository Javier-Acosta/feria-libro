schema: spec-driven

context: |
  Aplicación web de la Feria del Libro desarrollada con Next.js 16, TypeScript,
  React y Tailwind CSS. El idioma de la interfaz y de los artefactos es español.
  PocketBase provee autenticación, base de datos SQLite y almacenamiento de medios.
  La primera entrega prioriza una web pública simple y un área protegida para que
  personal autorizado gestione noticias, invitados, mapa y agenda del evento.

